
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Trzy tabele</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    padding: 30px;
    text-align: center;
}

h1 {
    color: #333;
}

.tables {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 25px;
}

.box {
    background: white;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

table {
    border-collapse: collapse;
    margin: auto;
}

td, th {
    border: 2px solid #555;
    width: 55px;
    height: 55px;
    text-align: center;
    vertical-align: middle;
    font-size: 18px;
}

th {
    background: #cfe8f7;
}

.green {
    background: #c8dca8;
}
</style>
</head>

<body>

<h1>Trzy tabele – scalanie komórek</h1>

<div class="tables">

<!-- TABELA 1 -->
<div class="box">
<h2>Tabela 1</h2>

<table>
<tr>
<th>1</th><th>2</th><th>3</th>
<th>4</th><th>5</th><th>6</th>
</tr>

<tr>
<th>2</th>
<td>a</td><td class="green">b</td>
<td class="green">c</td><td>d</td><td>e</td>
</tr>

<tr>
<th>3</th>
<td>f</td><td>g</td><td>h</td>
<td>i</td><td class="green">j</td>
</tr>

<tr>
<th>4</th>
<td>k</td><td>l</td><td>m</td>
<td>n</td><td class="green">o</td>
</tr>

<tr>
<th>5</th>
<td class="green">p</td><td class="green">q</td>
<td class="green">r</td><td>s</td><td>t</td>
</tr>

<tr>
<th>6</th>
<td class="green">u</td><td class="green">v</td>
<td class="green">w</td><td>y</td><td>z</td>
</tr>
</table>
</div>


<!-- TABELA 2 -->
<div class="box">
<h2>Tabela 2</h2>

<table>
<tr>
<th>1</th><th>2</th><th>3</th>
<th>4</th><th>5</th><th>6</th>
</tr>

<tr>
<th>2</th>
<td>a</td>
<td class="green" colspan="2">b, c</td>
<td>d</td><td>e</td>
</tr>

<tr>
<th>3</th>
<td>f</td><td>g</td><td>h</td>
<td>i</td>
<td class="green" rowspan="2">j, o</td>
</tr>

<tr>
<th>4</th>
<td>k</td><td>l</td><td>m</td><td>n</td>
</tr>

<tr>
<th>5</th>
<td class="green" colspan="3" rowspan="2">
p, q, r, u, v, w
</td>
<td>s</td><td>t</td>
</tr>

<tr>
<th>6</th>
<td>y</td><td>z</td>
</tr>
</table>
</div>


<!-- TABELA 3 -->
<div class="box">
<h2>Tabela 3 – A, F, K</h2>

<table>
<tr>
<th>1</th><th>2</th><th>3</th>
<th>4</th><th>5</th><th>6</th>
</tr>

<tr>
<th>2</th>
<td class="green" rowspan="3">a, f, k</td>
<td>b</td><td>c</td><td>d</td><td>e</td>
</tr>

<tr>
<th>3</th>
<td>g</td><td>h</td><td>i</td><td>j</td>
</tr>

<tr>
<th>4</th>
<td>l</td><td>m</td><td>n</td><td>o</td>
</tr>

<tr>
<th>5</th>
<td>p</td><td>q</td><td>r</td><td>s</td><td>t</td>
</tr>

<tr>
<th>6</th>
<td>u</td><td>v</td><td>w</td><td>y</td><td>z</td>
</tr>

</table>
</div>

</div>

</body>
</html>
